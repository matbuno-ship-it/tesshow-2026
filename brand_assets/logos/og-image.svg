<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Saira+Stencil+One&amp;family=Manrope:wght@500;700&amp;display=swap');
      .tes { font-family: 'Saira Stencil One', sans-serif; font-weight: 400; font-size: 170px; }
      .a { fill: #ffffff; }
      .b { fill: #ffb3ac; }
      .badge { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 22px; fill: #ffb3ac; letter-spacing: 0.3em; }
      .tag { font-family: 'Manrope', sans-serif; font-weight: 500; font-size: 26px; fill: #e0bfbb; letter-spacing: 0.12em; }
    </style>
    <radialGradient id="bg-glow-og" cx="20%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f4625a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#131313" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-og2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#8d1518" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#131313" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#131313"/>
  <rect width="1200" height="630" fill="url(#bg-glow-og)"/>
  <rect width="1200" height="630" fill="url(#bg-glow-og2)"/>
  <text x="600" y="280" class="badge" text-anchor="middle">20. ROČNÍK • 2026</text>
  <text x="600" y="400" class="tes" text-anchor="middle">
    <tspan class="a">TES</tspan><tspan class="b">SHOW</tspan>
  </text>
  <text x="600" y="475" class="tag" text-anchor="middle">17. SEPTEMBER • HOTEL APHRODITE • RAJECKÉ TEPLICE</text>
</svg>
